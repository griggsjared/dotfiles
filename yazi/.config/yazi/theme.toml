# RPG theme for Yazi.
# Uses ANSI named colors so it tracks the ghostty "rpg" palette exactly.

[mgr]
cwd = { fg = "green" }

# Find
find_keyword  = { fg = "yellow", bold = true, italic = true, underline = true }
find_position = { fg = "magenta", bg = "reset", bold = true, italic = true }

# Markers
marker_copied   = { fg = "green", bg = "green" }
marker_cut      = { fg = "red", bg = "red" }
marker_marked   = { fg = "cyan", bg = "cyan" }
marker_selected = { fg = "yellow", bg = "yellow" }

# Counts
count_copied   = { fg = "black", bg = "green" }
count_cut      = { fg = "black", bg = "red" }
count_selected = { fg = "black", bg = "yellow" }

# Border
border_symbol = ""
border_style  = { fg = "darkgray" }

[tabs]
active   = { fg = "black", bg = "green", bold = true }
inactive = { fg = "green", bg = "black" }

[mode]
normal_main = { fg = "black", bg = "green", bold = true }
normal_alt  = { fg = "green", bg = "black" }

select_main = { fg = "black", bg = "magenta", bold = true }
select_alt  = { fg = "magenta", bg = "black" }

unset_main = { fg = "black", bg = "red", bold = true }
unset_alt  = { fg = "red", bg = "black" }

[status]
perm_sep   = { fg = "darkgray" }
perm_type  = { fg = "blue" }
perm_read  = { fg = "yellow" }
perm_write = { fg = "red" }
perm_exec  = { fg = "green" }

progress_label  = { fg = "white", bold = true }
progress_normal = { fg = "green" }
progress_error  = { fg = "red" }

[pick]
border   = { fg = "blue" }
active   = { fg = "magenta", bold = true }
inactive = {}

[input]
border   = { fg = "blue" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border       = { fg = "blue" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "blue" }
title   = {}
hovered = { fg = "magenta", bold = true }

[which]
mask            = { bg = "black" }
cand            = { fg = "cyan" }
rest            = { fg = "darkgray" }
desc            = { fg = "magenta" }
separator       = "  "
separator_style = { fg = "darkgray" }

[help]
on        = { fg = "cyan" }
run       = { fg = "magenta" }
hovered   = { reversed = true, bold = true }
footer    = { fg = "black", bg = "white" }
icon_info = ""
icon_warn = ""
icon_error = ""

[spot]
border   = { fg = "blue" }
title    = { fg = "blue" }
tbl_col  = { fg = "cyan" }
tbl_cell = { fg = "magenta", bg = "darkgray" }

[notify]
title_info  = { fg = "green" }
title_warn  = { fg = "yellow" }
title_error = { fg = "red" }

[filetype]
rules = [
	{ mime = "image/*", fg = "cyan" },
	{ mime = "{audio,video}/*", fg = "yellow" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "magenta" },
	{ mime = "application/{pdf,doc,rtf}", fg = "green" },
	{ mime = "vfs/{absent,stale}", fg = "darkgray" },
	{ url = "*", fg = "white" },
	{ url = "*/", fg = "blue" },
]

# Square (non-rounded) ends on the hovered-item indicator bar.
[indicator]
padding = { open = "▐", close = "▌" }

# Hide file/folder icons in the file list.
[icon]
dirs  = []
files = []
exts  = []
globs = []
conds = []


