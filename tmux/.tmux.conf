# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#T"

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u

# Bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Windows
bind t new-window -c "#{pane_current_path}"
bind c confirm-before "kill-window"
unbind &

# Panes
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind a select-pane -t :.+
bind -r M-Left  resize-pane -L 1
bind -r M-Right resize-pane -R 1
bind -r M-Up    resize-pane -U 1
bind -r M-Down  resize-pane -D 1

# Popups
bind o display-popup -E -w 60% -h 40% "zsh -c 'tm'"
# Same popup when Ctrl is still held from the prefix; the default C-o rotates panes.
bind C-o display-popup -E -w 60% -h 40% "zsh -c 'tm'"

# Config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Appearance: copy mode
setw -g mode-style 'fg=black bg=cyan'

# Appearance: panes
set -g pane-border-style 'fg=cyan'
set -g pane-active-border-style 'fg=green'

# Appearance: popups
set -g popup-style default
set -g popup-border-style default

# Appearance: status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=magenta,nobold bg=default'
set -g status-left '  #S '
set -g status-left-length 100
set -g status-right ''
set -g status-right-length 0
setw -g window-status-style 'fg=gray,nobold bg=default'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-style 'fg=green,bold bg=default'
setw -g window-status-current-format ' #I:#W#F '

# Appearance: messages
set -g message-style 'fg=green,nobold bg=default'
set -g message-command-style 'fg=green,nobold bg=default'
